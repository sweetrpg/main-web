---
apiVersion: v1
kind: ConfigMap

metadata:
    name: web-env

data:
    SHARED_ASSETS_URL: https://dev.sweetrpg.com/assets
    BUILD_INFO_PATH: /app/config/build-info.json
    LOG_LEVEL: info
    # auth-web's own dedicated Redis instance (see sweetrpg/auth-web's kubernetes/base) - this
    # app only ever reads the shared session it writes, never writes to it. Unset means every
    # visitor reads as logged-out (see session_client.rs's fail-open default), not a startup
    # failure.
    REDIS_HOST: auth-redis.sweetrpg-support.svc.cluster.local
    REDIS_PORT: "6379"
    # Same collector the other frontends export to (tempo-distributor's OTLP/HTTP receiver).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318
