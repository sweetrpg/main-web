---
apiVersion: v1
kind: ConfigMap

metadata:
    name: web-env

data:
    ASSETS_URL: https://dev.sweetrpg.com/assets
    SHARED_URL: https://dev.sweetrpg.com/shared
    BUILD_INFO_PATH: /app/config/build-info.json
    LOG_LEVEL: info
    # Server-to-server, no ingress in the path - same value admin-web's own dev overlay uses.
    # Unset means AdminClient stays permanently disabled (banners/maintenance-mode badges never
    # render, no error) - see config.rs's admin_api_url doc comment.
    ADMIN_API_URL: http://api-v1.sweetrpg-admin.svc.cluster.local:8000
    # auth-web's own dedicated Redis instance in sweetrpg-auth (see sweetrpg/auth-web's
    # kubernetes/base) - this app only ever reads the shared session it writes, never writes to
    # it. Named SHARED_SESSION_REDIS_* (matching catalog-web's convention) rather than plain
    # REDIS_*, so this app's own cache/rate-limit Redis (if one is ever added) gets its own env
    # vars instead of colliding with this one. Unset means every visitor reads as logged-out (see
    # session_client.rs's fail-open default), not a startup failure. Host/DB must match
    # auth-web's own REDIS_HOST/REDIS_DB exactly (fullnameOverride "redis" in
    # support/common/cache's Helm chart) - a mismatch here fails open the same way an
    # unreachable host does, silently, with no startup error.
    SHARED_SESSION_REDIS_HOST: redis.sweetrpg-auth.svc.cluster.local
    SHARED_SESSION_REDIS_PORT: "6379"
    SHARED_SESSION_REDIS_DB: "0"
    # Same collector the other frontends export to (tempo-distributor's OTLP/HTTP receiver).
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318
    ENV: dev
