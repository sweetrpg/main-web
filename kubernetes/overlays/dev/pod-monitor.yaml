---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
    name: sweetrpg-main-web
    labels:
        release: prometheus

spec:
    namespaceSelector:
        matchNames:
            - sweetrpg-main
    podMetricsEndpoints:
        - port: http
    selector:
        matchLabels:
            app.kubernetes.io/name: main-web
            app.kubernetes.io/version: v1
            app.kubernetes.io/component: web
            app.kubernetes.io/part-of: main
