---
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret

metadata:
    name: main-web-auth

spec:
    externalSecretName: web-auth

    namespaceSelector:
        matchLabels:
            name: sweetrpg-main

    refreshTime: 1m

    externalSecretSpec:
        refreshInterval: "1h"
        secretStoreRef:
            name: akeyless
            kind: ClusterSecretStore
        target:
            name: web-auth
            creationPolicy: Owner
        dataFrom:
            - extract:
                  key: Auth0

