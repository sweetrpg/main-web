---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-main

resources:
    - ../../base
    - configmaps.yaml
    - secrets.yaml
    - pod-monitor.yaml
    - ingress.yaml
    - middlewares.yaml

labels:
  - pairs:
      platform: sweetrpg
      app: web
      component: web
      package: main
      version: v1

generatorOptions:
    disableNameSuffixHash: true
