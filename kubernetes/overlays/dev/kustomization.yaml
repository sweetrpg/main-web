---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-main

resources:
    - ../../base
    - configmaps.yaml
    - hpa.yaml
    - pdb.yaml
    - podmonitor.yaml
    - ingress.yaml
patches:
    - path: replicas.yaml

generatorOptions:
    disableNameSuffixHash: true
