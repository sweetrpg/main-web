---
apiVersion: v1
kind: ConfigMap

metadata:
    name: web-env

data:
    # Shared host behind the single traefik-tailscale front door (see
    # support/config/K8s/traefik/overlays/minikube) - Traefik strips /assets before it reaches
    # assets-web, same as the dev overlay's dev.sweetrpg.com/assets convention.
    ROOT_URL: https://sweetrpg.local/
    ASSETS_URL: https://sweetrpg.local/assets
    SHARED_URL: https://sweetrpg.local/shared
    BUILD_INFO_PATH: /app/config/build-info.json
    LOG_LEVEL: info
    # Server-to-server, no ingress in the path - same value admin-web's own local overlay uses.
    # Unset means AdminClient stays permanently disabled (banners/maintenance-mode badges never
    # render, no error) - see config.rs's admin_api_url doc comment.
    ADMIN_API_URL: http://api-v1.sweetrpg-admin.svc.cluster.local:8000
    # auth-web's own dedicated Redis instance - see dev overlay's comment for the same reasoning.
    SHARED_SESSION_REDIS_HOST: cache.sweetrpg-auth.svc.cluster.local
    SHARED_SESSION_REDIS_PORT: "6379"
    SHARED_SESSION_REDIS_DB: "0"
    # Same collector the other frontends export to (tempo-distributor's OTLP/HTTP receiver).
    # OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318
    ENV: local
