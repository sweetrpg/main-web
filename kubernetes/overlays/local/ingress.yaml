---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
    name: web-v1
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        kubernetes.io/ingress.class: tailscale

spec:
    ingressClassName: traefik
    rules:
        - host: local.sweetrpg.com
          http:
              paths:
                  # Root path, no Middleware: there's no prefix to strip here, unlike every
                  # other frontend's own `/<name>` path.
                  - pathType: Prefix
                    path: /
                    backend:
                        service:
                            name: main-web-v1
                            port:
                                name: http
    tls:
        - hosts:
              - local.sweetrpg.com
          # Shared secretName across every frontend's Ingress for this host - see catalog-web's
          # Ingress comment for why this must match exactly.
          secretName: sweetrpg-local-tls
