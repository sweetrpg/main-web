---
kind: Service
apiVersion: v1

metadata:
    name: web-v1

spec:
    selector:
        platform: sweetrpg
        app: sweetrpg-main-web-v1
        component: web
        package: main
        version: v1
    type: LoadBalancer
    ports:
        - name: http
          port: 8080
          targetPort: http
