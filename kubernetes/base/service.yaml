---
kind: Service
apiVersion: v1

metadata:
    name: web-v1

spec:
    selector:
        app.kubernetes.io/name: main-web
        app.kubernetes.io/version: v1
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: main
    type: ClusterIP
    ports:
        - name: http
          port: 8080
          targetPort: http
