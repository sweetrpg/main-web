---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: web-v1

spec:
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            app.kubernetes.io/name: main-web
            app.kubernetes.io/version: v1
            app.kubernetes.io/component: web
    template:
        metadata:
            annotations:
                reloader.stakater.com/auto: "true"
                openfeature.dev/enabled: "true"
                openfeature.dev/featureflagsource: "sweetrpg-system/main-web"
        spec:
            serviceAccountName: web
            # No dependency of this service's own is at risk of the classic <SERVICE_NAME>_PORT
            # collision (docs/service-conventions.md) today, but this has no DNS-based service
            # discovery of its own to opt out of the legacy env-var injection either - cheap to
            # disable defensively regardless.
            enableServiceLinks: false
            imagePullSecrets:
                - name: sweetrpg-registry
            containers:
                - name: app
                  image: main-web
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: web-common
                      - configMapRef:
                            name: web-env
                      - secretRef:
                            name: web-shared-session
                  env: []
                  ports:
                      - containerPort: 8080
                        name: http
                  resources:
                      requests:
                          cpu: "10m"
                          memory: "20Mi"
                      limits:
                          cpu: "0.5"
                          memory: "256Mi"
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      initialDelaySeconds: 10
                      timeoutSeconds: 5
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: http
                      initialDelaySeconds: 5
                      timeoutSeconds: 5
            restartPolicy: Always
